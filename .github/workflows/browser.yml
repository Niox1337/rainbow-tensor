name: Notebook browser checks
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook and browser tools
        run: python -m pip install -e . -r scripts/requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check browser messages and keyboard navigation
        run: python scripts/check_browser.py
      - name: Check standalone lessons offline
        run: python scripts/check_lesson_html.py --screenshot "${{ runner.temp }}/rainbow-offline.png"
      - name: Check a live JupyterLab kernel
        run: python scripts/check_jupyter.py --screenshot "${{ runner.temp }}/rainbow-jupyter.png"
      - name: Save notebook screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-${{ matrix.os }}
          path: |-
            ${{ runner.temp }}/rainbow-jupyter*.png
            ${{ runner.temp }}/rainbow-jupyter*.txt
            ${{ runner.temp }}/rainbow-offline*.png
          if-no-files-found: ignore
