name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
      - name: Validate distributions
        if: matrix.python-version == '3.12'
        run: python scripts/check_distribution.py
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install -e . -r docs/requirements.txt
      - name: Execute verified lessons
        run: python scripts/check_lessons.py
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
